name: Native engine build
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  scumm:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        backend: ['null', sdl]
    steps:
      - uses: actions/checkout@v4
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential python3 git libsdl2-dev
      - name: Build pinned fork
        run: python3 tools/build.py --backend ${{ matrix.backend }} --jobs 2
      - name: Verify source preparation is idempotent
        run: python3 tools/bootstrap.py
      - name: Verify dependent patches and preservation of local edits
        if: matrix.backend == 'null'
        run: python3 tools/test_bootstrap.py
      - name: Exercise real startup without proprietary assets
        if: matrix.backend == 'null'
        run: python3 tools/test_startup.py build/null/scummvm
      - name: Test portable portrait contract
        if: matrix.backend == 'null'
        run: |
          c++ -std=c++11 -Wall -Wextra -Werror -fsanitize=address,undefined -Iengine tools/test_portrait.cpp -o build/test-portrait
          build/test-portrait
      - name: Test portable mobile layout contract
        if: matrix.backend == 'null'
        run: |
          c++ -std=c++11 -Wall -Wextra -Werror -fsanitize=address,undefined -Iengine tools/test_mobile_layout.cpp -o build/test-mobile-layout
          build/test-mobile-layout
